name: Build Lucid Air IPA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lucidair:
    runs-on: macos-15
    defaults:
      run:
        working-directory: LucidAirBuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          rm -rf build Payload LucidAir-unsigned.ipa
          xcodebuild \
            -project LucidAir.xcodeproj \
            -scheme LucidAir \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'LucidAir.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/LucidAir.app
          /usr/bin/zip -qry LucidAir-unsigned.ipa Payload
          test -s LucidAir-unsigned.ipa
          echo "Created $(pwd)/LucidAir-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LucidAir-unsigned-IPA
          path: LucidAirBuild/LucidAir-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
