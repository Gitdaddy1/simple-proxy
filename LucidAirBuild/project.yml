name: LucidAir
options:
  bundleIdPrefix: com.lucidair.personal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  LucidAir:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LucidAirApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucidair.personal.LucidAir
        PRODUCT_NAME: LucidAir
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
schemes:
  LucidAir:
    build:
      targets:
        LucidAir: all
    run:
      config: Debug
    archive:
      config: Release
